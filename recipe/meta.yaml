{% set name = "rbdl" %}
{% set version = "3.4.0" %}
{% set build_num = 6 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rbdl/rbdl/archive/v{{ version }}.tar.gz
  sha256: 545f10a4f6ccf20f84b43324fd5879daca1d6819a0db5050d0e6a94be9293e29

build:
  number: {{ build_num }}
  rpaths:
    - lib/
    - lib/{{ name }}/
  run_exports:
    - {{ pin_subpackage('rbdl', max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - pkgconfig
    - cmake
    - ninja
    - eigen
    - casadi
  host:
    - eigen
    - eigen-abi-devel
    - casadi
    - pkgconfig
  run:
    - eigen
    - casadi

test:
  commands:
    - test $PREFIX/lib/librbdl$SHLIB_EXT  # [unix]
    - if not exist %PREFIX%\\Lib\\rbdl*.lib exit 1  # [win]

about:
  home: https://bitbucket.org/rbdl/rbdl
  license: Zlib
  license_file: LICENSE
  summary: RBDL is a highly efficient C++ library that contains some essential rigid body dynamics algorithms.

extra:
  recipe-maintainers:
    - pariterre
